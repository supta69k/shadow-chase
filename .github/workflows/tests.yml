# pygame is the only runtime dependency; the core tests need neither pygame
# nor a display, but we install it anyway to validate the real setup path.

name: tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies (binary wheels only)
        run: |
          python -m pip install --upgrade pip
          pip install --only-binary=:all: -r requirements.txt
          pip freeze
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Smoke test (one full AI turn)
        run: python main.py --smoke-test
